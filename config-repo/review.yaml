server:
  port: 8082

spring:
  application:
    name: review
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://localhost:5432/reviewsDB
    username: postgres
    password: postgres
    hikari:
      initializationFailTimeout: 60000
  cloud:
    function:
      definition: messageProcessor
    stream:
      default:
        contentType: application/json
      bindings:
        messageProcessor-in-0:
          destination: reviews
          group: reviewsGroup
          consumer:
            maxAttempts: 3
            backOffInitialInterval: 500
            backOffMaxInterval: 1000
            backOffMultiplier: 2.0
      rabbit:
        bindings:
          messageProcessor-in-0:
            consumer:
              autoBindDlq: true
              republishToDlq: true

logging:
  level:
    root: INFO
    com.store.app: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://reviewsDB:5432/reviewsDB
    username: postgres
    password: postgres
